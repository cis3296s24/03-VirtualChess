# Console logging for VirtualChess (SLF4J's simple logger).
#
# Lines look like:   21:04:13.518 INFO Game - Game over: Bob wins by checkmate (0-1)
#
# To see more detail (every move, every Stockfish command), run with:
#   ./mvnw javafx:run -Dlog.level=debug
# (pom.xml passes that on as -Dorg.slf4j.simpleLogger.defaultLogLevel, which overrides the value below.)

# Levels, from most to least detail: trace, debug, info, warn, error
org.slf4j.simpleLogger.defaultLogLevel=info

# Third-party libraries only report problems
org.slf4j.simpleLogger.log.org.sqlite=warn

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

# Standard output, so normal log lines don't show up in red in IDE consoles
org.slf4j.simpleLogger.logFile=System.out
